<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Set map title-->
    <title>Example Leaflet Map with Filtering</title>
</head>

<body class="">
    <!--Heading-->
    <h1>Example Leaflet Map with Filtering</h1>

    <!--The Map-->
    <div style="margin: auto;" id="map"
        class="leaflet-container leaflet-touch leaflet-retina leaflet-fade-anim leaflet-grab leaflet-touch-drag leaflet-touch-zoom"
        tabindex="0">

    </div>

    <!--The Filter box-->
    <div id="filters" aria-label="Filters" title="Filter locations">
        <h3>Filters</h3>
        <div id="filters-list">Loading...</div>
    </div>

    <!--The Scripts are where the data is loaded and the map/filter logic is implemented -->
    <script type="module" src="script.js"></script>
</body>

</html>
